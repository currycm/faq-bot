name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # torch 不在 requirements.txt 里（Docker 里单独装 CPU 版避免拉 CUDA 版）。
      # CI 也先装 CPU torch，这样后面安装 sentence-transformers 时不会再去拉 800MB 的 CUDA 版。
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      # 缓存 BGE 模型，避免每次跑 CI 都重新下载 93MB
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-zh-v1.5

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .

      # 2026-09 修复：test_ui.py 的集成测试依赖 8000 端口的 API 服务，
      # 此前 CI 只跑 pytest -q、不启动服务，那 6 个测试在 CI 上永远
      # skip，"128 个测试"虚高。现在先拉起 uvicorn 再跑测试。
      - name: Start API server
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          nohup uvicorn api:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "API ready after ${i} tries"
              exit 0
            fi
            sleep 2
          done
          echo "::error::API failed to start"
          cat /tmp/api.log
          exit 1

      - name: Run tests
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: pytest -q
