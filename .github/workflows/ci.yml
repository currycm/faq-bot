name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # torch 不在 requirements.txt 里（Docker 里单独装 CPU 版避免拉 CUDA 版）。
      # CI 也先装 CPU torch，这样后面安装 sentence-transformers 时不会再去拉 800MB 的 CUDA 版。
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      # 缓存 BGE 模型，避免每次跑 CI 都重新下载 93MB
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-zh-v1.5

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Run tests
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: pytest -q
