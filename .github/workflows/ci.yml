name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # torch 不在 requirements.txt 里（Docker 里单独装 CPU 版避免拉 CUDA 版）。
      # CI 也先装 CPU torch，这样后面安装 sentence-transformers 时不会再去拉 800MB 的 CUDA 版。
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx pytest-cov

      # 缓存 BGE 模型，避免每次跑 CI 都重新下载 93MB
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-zh-v1.5

      # ruff 必须锁版本：格式化风格会随小版本变化（2026-09-18 踩过一次：
      # CI 装到 0.16.8、本地是 0.12.0，ruff format --check 直接红掉 52 个文件）。
      # 本地/CI 用同一个版本，改版本时同步改这里并全量重排一次。
      - name: Lint (ruff)
        run: |
          pip install ruff==0.16.8
          ruff check .
          ruff format --check .

      # 2026-09 修复：test_ui.py 的集成测试依赖 8000 端口的 API 服务，
      # 此前 CI 只跑 pytest -q、不启动服务，那 6 个测试在 CI 上永远
      # skip，"128 个测试"虚高。现在先拉起 uvicorn 再跑测试。
      #
      # !! 等待判据必须与 tests/test_ui.py 的 backend fixture 一致（都是
      #    status=ok 且 ready=true）。2026-09-19 修：此前这里只 grep
      #    "status":"ok"，而 test_ui 看的是 ready 字段 —— 判据不一致会
      #    让服务"看起来起来了"但集成测试仍被 skip，覆盖率跌破 80% 门禁。
      - name: Start API server
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          nohup uvicorn api:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8000/health | python -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('status')=='ok' and d.get('ready') else 1)"; then
              echo "API ready after ${i} tries"
              exit 0
            fi
            sleep 2
          done
          echo "::error::API failed to start"
          cat /tmp/api.log
          exit 1

      - name: Run tests (with coverage)
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: pytest -q --cov=src --cov-report=term --cov-fail-under=80

      # 效果回归门禁：单测只保证「代码没坏」，不保证「效果没掉」。
      # 改检索 / 语料后召回率可能悄悄下滑而 pytest 全绿（测试集固定、
      # 不校验指标）。这里在固定的 tests/test_set.json 上断言最小召回率。
      # 基线取 0.98：当前实测 100%，留 2 个点余量 —— 挡得住小回归，
      # 又不会因模型/依赖的微小波动误红。手动放行：本地先跑同一条命令。
      - name: Effect gate (recall@1)
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: python evaluate.py --min-recall 0.98
