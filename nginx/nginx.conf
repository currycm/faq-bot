# faq-bot Nginx 反代配置
#
# 关键功能：
#   - HTTPS 终结（TLS 1.2/1.3）
#   - 单 IP 限流（5 r/s 稳态 + 20 突发）
#   - 安全头（HSTS / X-Frame / X-Content-Type）
#   - trace_id 透传（X-Trace-Id → FastAPI，头名必须与 api.py 读取的一致）

# ----------------------- 上游 -----------------------
upstream faq_api {
    server api:8000;
    keepalive 32;          # 长连接，减少 TCP 握手
}

# ----------------------- 限流 -----------------------
# 单 IP 稳态：5 r/s
limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=5r/s;
# 单 IP 突发：桶容量 20（瞬间允许 20 个排队）
# 超出后返回 429 而不是 503

# ----------------------- HTTP → HTTPS 重定向 -----------------------
server {
    listen 80;
    server_name _;            # 替换成你的域名（如 faq.niit.edu.cn）
    return 301 https://$host$request_uri;
}

# ----------------------- HTTPS 主服务 -----------------------
server {
    listen 443 ssl http2;
    server_name _;

    # TLS 证书（Let\'s Encrypt 或自签）
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 安全头
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 日志格式：含 trace_id、响应时间、上游地址
    log_format faq '$remote_addr - $request_id '
                  '"$request" $status $body_bytes_sent '
                  '$upstream_response_time "$http_user_agent"';
    access_log /var/log/nginx/faq_access.log faq;

    # ---- 健康检查直返（不计入限流/日志）----
    location = /health {
        access_log off;
        proxy_pass http://faq_api/health;
    }

    # ---- 主代理 ----
    location / {
        # 限流：5 r/s，桶容量 20
        limit_req zone=ip_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://faq_api;
        proxy_http_version 1.1;

        # 透传请求头
        # 2026-09 修复：X-Forwarded-For 用 $remote_addr 覆盖而非追加。
        # $proxy_add_x_forwarded_for 会把客户端自带的伪造 XFF 拼在最前，
        # 后端取第一段 = 永远取到攻击者填的值，IP 限流完全失效。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # !! 头名必须是 X-Trace-Id：api.py 读的是 request.headers.get("X-Trace-Id")。
        #    2026-09 修复：此前写的是 X-Request-ID，FastAPI 收不到，
        #    每个请求都自己生成新 uuid，nginx access log 的 $request_id
        #    与 API 侧 trace_id 永远对不上，跨层追踪断链。
        proxy_set_header X-Trace-Id        $request_id;

        # 超时：LLM 兜底最长 30s，留 60s 余量
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 缓冲：流式响应要关（暂未用，先留着）
        proxy_buffering on;
    }

    # ---- 静态前端（可选：以后用 HTML/JS 前端时启用）----
    # location /static/ {
    #     alias /usr/share/nginx/html/static/;
    #     expires 7d;
    # }
}