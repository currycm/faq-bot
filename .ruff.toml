# Ruff 配置（CI 静态检查基线）
# 目标：拦截真正的 bug（未定义名 / 重复定义 / 语法问题），
# 不因为风格 nit 把流水线变红。团队成形后可逐步收紧。
line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W"]
ignore = [
    "E402",   # 允许模块级 import 不在文件顶部（本项目用 sys.path 注入 src 路径）
    "E501",   # 超长行（多为 URL / 长字符串），不阻塞 CI
    "E741",   # 含糊变量名（如 l / i），局部变量风险低
    "F401",   # 未使用 import（含有意保留的副作用导入）
    "F841",   # 未使用局部变量
    "F601",   # 字典字面量重复 key（已确认无功能影响）
]

# 不自动格式化，仅做检查
[format]
quote-style = "double"
