# faq-bot docker-compose.yml
#
# 启动：
#   docker compose up -d
# 查看日志：
#   docker compose logs -f api
# 停止：
#   docker compose down
#
# !! 首次部署前准备：
#   1. mkdir -p secrets logs
#   2. echo -n "sk-xxx" > secrets/deepseek_key.txt
#   3. echo -n "your-key" > secrets/hefeng_key.txt
#
# 本文件只跑 api：nginx 层等 TLS 证书准备就绪后再加回来，
# 到时候 api 的 ports 要改成 expose（不再直接对宿主暴露 8000）。

services:
  api:
    build: .
    image: faq-bot:v7.0
    container_name: faq-bot-api
    restart: unless-stopped
    ports:
      - "8000:8000"          # 联调阶段先直暴露 8000，便于本地访问
    environment:
      # KEY 经 Docker secret 注入（敏感内容不会出现在 docker inspect）
      - DEEPSEEK_API_KEY_FILE=/run/secrets/deepseek_key
      - HEFENG_API_KEY_FILE=/run/secrets/hefeng_key
      # !! 和风专属 API Host 从 .env 读取（2026-09 修复：账号专属域名
      #    属账号配置，不再明文写进仓库）。留空时 config.py 回退官方 devapi。
      #    填法与两个大坑（host 前缀是控制台分配的、不是 key 前 8 位；
      #    GEO_URL 必须带 /geo 后缀）详见 .env.example 的和风一节。
      - HEFENG_BASE_URL=${HEFENG_BASE_URL:-}
      - HEFENG_GEO_URL=${HEFENG_GEO_URL:-}
      # 通用配置
      - LOG_LEVEL=info
      # 强制 HuggingFace 离线（模型已预下载进镜像）
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      # 部署安全（值在 .env / shell 里配置，见 .env.example 部署安全一节）：
      #   CORS 默认与本机 Streamlit(8501) 匹配；TRUST_PROXY_HEADERS 仅在
      #   API 只暴露于可信 nginx 之后时设 1，否则客户端可伪造 XFF 绕过限流；
      #   不设（0）时走 nginx 上线会让全校共用一个 IP 限流桶，正常流量互相误伤。
      - FAQ_CORS_ORIGINS=${FAQ_CORS_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}
      - FAQ_TRUST_PROXY_HEADERS=${FAQ_TRUST_PROXY_HEADERS:-0}
    secrets:
      - deepseek_key
      - hefeng_key
    volumes:
      # 日志持久化（容器重启日志不丢）
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; \
              urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s    # BGE 模型首次加载要给足时间
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M    # BGE 模型约 400MB + worker 余量
        reservations:
          cpus: "1.0"
          memory: 1024M

secrets:
  # !! 文件权限设为 0400（仅 root 可读），容器内映射到 /run/secrets/
  deepseek_key:
    file: ./secrets/deepseek_key.txt
  hefeng_key:
    file: ./secrets/hefeng_key.txt